services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: practice_zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: practice_kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      #KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092      FOR LOCAL RUNNING
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  topic-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka_topic_init
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-c", "/create-topics.sh"]
    volumes:
      - ./create-topics.sh:/create-topics.sh
    networks:
      - default

  producer:
    build:
      context: .
      dockerfile: producer_app/Dockerfile
    depends_on:
      - kafka
    ports:
      - "8081:8081"

  consumer1:
    build:
      context: .
      dockerfile: consumer_app/Dockerfile
    depends_on:
      - kafka
    ports:
      - "8082:8082"

  #consumer2:
   # build:
    #  context: .
     # dockerfile: consumer_app/Dockerfile
    #depends_on:
     # - kafka
    #ports:
     # - "8083:8082"

networks:
  default:
    driver: bridge
