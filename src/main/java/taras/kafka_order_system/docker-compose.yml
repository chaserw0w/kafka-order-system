services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: study_zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: study_kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  producer:
    build:
      context: ./producer_app
    depends_on:
      - kafka

  consumer:
    build:
      context: ./consumer_app
    depends_on:
      - kafka
    deploy:
      replicas: 2  # Here, two instances of Consumer are created